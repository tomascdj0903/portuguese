<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de positionnement — Português.zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link rel="stylesheet" href="shared/style.css">
</head>
<body class="bg-white dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 font-sans antialiased transition-colors duration-300">
<div id="scrollbar"></div>
<div id="app-header"></div>
<div id="app-modal-root"></div>

<section class="max-w-3xl mx-auto px-5 md:px-8 py-16 md:py-20">
  <div class="mb-10">
    <div class="text-[11px] font-semibold tracking-widest uppercase text-accent-600 dark:text-accent-400 mb-3">Avant de commencer</div>
    <h1 class="font-display text-3xl md:text-4xl font-bold tracking-tight">Test de positionnement</h1>
    <p class="mt-4 text-neutral-500 dark:text-neutral-400 leading-relaxed">15 questions, 3 minutes, aucune mauvaise réponse : ça sert juste à savoir par où commencer. Deux questions demandent d'écouter — active le son.</p>
  </div>
  <div id="quizRoot" class="rounded-3xl border border-neutral-200 dark:border-neutral-800 p-7 md:p-9 shadow-softer">
    <div class="h-1 rounded-full bg-neutral-100 dark:bg-neutral-800 overflow-hidden mb-7"><div id="qProgressFill" class="h-full bg-accent-600 rounded-full transition-all duration-300" style="width:0%"></div></div>
    <div id="qArea"></div>
    <div id="qResult" class="hidden"></div>
  </div>
</section>

<div id="app-footer"></div>

<script src="shared/data.js"></script>
<script src="shared/app.js"></script>
<script>
initSharedChrome(null);

function levelFromScore(score){
  if(score<=3) return {code:'0', label:'Débutant complet', advice:"Commence par le Module 1 — Se présenter."};
  if(score<=7) return {code:'A0', label:'Découverte', advice:"Révise les salutations puis enchaîne les modules de vocabulaire."};
  if(score<=11) return {code:'A1', label:'Élémentaire', advice:"Concentre-toi sur la Grammaire et le Vocabulaire."};
  if(score<=14) return {code:'A2', label:'Pré-intermédiaire', advice:"Passe directement à la Prononciation et aux Jeux pour consolider."};
  return {code:'B1', label:'Intermédiaire', advice:"Fonce sur l'Examen final et entraîne-toi à l'oral."};
}

const root = document.getElementById('quizRoot');
runQuiz(root, placementData, {
  onFinish: (score,total)=>{
    const lvl = levelFromScore(score);
    progress.level = { score, total, code: lvl.code, label: lvl.label };
    saveProgress();
    refreshProgressWidgets();
    document.getElementById('qResult').innerHTML = `
      <div class="text-center">
        <div class="font-display text-5xl font-bold text-accent-700 dark:text-accent-400">${score}<span class="text-2xl text-neutral-300 dark:text-neutral-700"> / ${total}</span></div>
        <div class="inline-flex items-center gap-1.5 mt-4 px-3 py-1.5 rounded-full text-[13px] font-semibold bg-accent-50 dark:bg-accent-950 text-accent-800 dark:text-accent-300">Niveau ${lvl.code} — ${lvl.label}</div>
        <p class="text-neutral-500 dark:text-neutral-400 mt-4 mb-6 max-w-sm mx-auto leading-relaxed text-sm">${lvl.advice}</p>
        <div class="flex justify-center gap-2">
          <a href="index.html" class="inline-flex items-center gap-2 rounded-xl bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 px-5 py-3 text-sm font-semibold hover:bg-neutral-700 dark:hover:bg-neutral-200 transition">Voir mon parcours →</a>
          <button type="button" id="restartBtn" class="inline-flex items-center gap-2 rounded-xl border border-neutral-200 dark:border-neutral-800 px-5 py-3 text-sm font-semibold hover:border-neutral-900 dark:hover:border-white transition">Refaire le test</button>
        </div>
      </div>`;
    document.getElementById('restartBtn').addEventListener('click', ()=> location.reload());
  }
});
</script>
</body>
</html>
